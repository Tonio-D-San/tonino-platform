# HTTPS terminates at a reverse proxy on the Docker host.
services:
  identity-service:
    container_name: identity-service-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:${SERVER_PORT:-8082}:8082"
  postgres:
    restart: unless-stopped
  keycloak:
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-5443}:8080"
