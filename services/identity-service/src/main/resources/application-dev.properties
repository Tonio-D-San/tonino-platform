# dev
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
management.endpoint.health.show-details=always
logging.level.it.asansonne=DEBUG
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Swagger authenticates in the browser using Authorization Code + PKCE.
springdoc.swagger-ui.oauth.client-id=${keycloak.client.frontend-client-id}
springdoc.swagger-ui.oauth.scopes=openid,profile,email
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth2-redirect-url=${application.host}/swagger-ui/oauth2-redirect.html
