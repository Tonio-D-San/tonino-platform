services:
  people:
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "127.0.0.1:${SERVER_PORT:-8082}:8082"
  postgres:
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
  keycloak:
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 5443
    ports:
      - "127.0.0.1:5443:5443"
    networks:
      default:
        aliases: [keycloak.localhost]
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  sonarqube: #    psw = Zoology0-Emphasize-Keenly
    image: sonarqube:community
    profiles: [quality]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
volumes:
  sonarqube_data:
  sonarqube_extensions:
