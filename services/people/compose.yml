# Combine with compose.dev.yml or compose.prod.yml and the matching --env-file.
name: tonino-platform-${SPRING_PROFILES_ACTIVE:?Select dev or prod}
services:
  people:
    build:
      context: .
      dockerfile: Dockerfile
      secrets: [maven_settings]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Required}
      SERVER_PORT: 8082
      APPLICATION_URL: ${APPLICATION_URL:?Required}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PEOPLE_NAME: ${DB_PEOPLE_NAME:?Required}
      DB_PEOPLE_USER: ${DB_PEOPLE_USER:?Required}
      DB_PEOPLE_PASSWORD: ${DB_PEOPLE_PASSWORD:?Required}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?Required}
      APP_ID: ${APP_ID:-people}
      KEYCLOAK_REALM_NAME: ${KEYCLOAK_REALM_NAME:-${APP_ID:-people}}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-${APP_ID:-people}-api}
      KEYCLOAK_APP_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID:-${APP_ID:-people}-fe}
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:-${APP_ID:-people}-be}
      PLATFORM_BACKEND_CLIENT_SECRET: ${PLATFORM_BACKEND_CLIENT_SECRET:?Required}
      APPLICATION_ISSUER_NGROK: ${APPLICATION_ISSUER_NGROK:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Required}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Required}
      POSTGRES_DB: ${DB_NAME:-postgres}
      DB_PEOPLE_NAME: ${DB_PEOPLE_NAME:?Required}
      DB_PEOPLE_USER: ${DB_PEOPLE_USER:?Required}
      DB_PEOPLE_PASSWORD: ${DB_PEOPLE_PASSWORD:?Required}
      KC_DB_NAME: ${KC_DB_NAME:?Required}
      KC_DB_USER: ${KC_DB_USER:?Required}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME:?Required}
      KC_DB_USERNAME: ${KC_DB_USER:?Required}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Required}
      KC_HOSTNAME: ${KEYCLOAK_URL:?Required}
      KC_HEALTH_ENABLED: "true"
      APP_ID: ${APP_ID:-people}
      KEYCLOAK_REALM_NAME: ${KEYCLOAK_REALM_NAME:-${APP_ID:-people}}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-${APP_ID:-people}-api}
      KEYCLOAK_APP_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID:-${APP_ID:-people}-fe}
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:-${APP_ID:-people}-be}
      PLATFORM_BACKEND_CLIENT_SECRET: ${PLATFORM_BACKEND_CLIENT_SECRET:?Required}
      APPLICATION_URL: ${APPLICATION_URL:?Required}
      FRONTEND_URL: ${FRONTEND_URL:-${APPLICATION_URL:?Required}}
    volumes:
      - ../keycloak/people.json:/opt/keycloak/data/import/${KEYCLOAK_REALM_NAME:-${APP_ID:-people}}-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  postgres_data:
secrets:
  maven_settings:
    file: ${MAVEN_SETTINGS_FILE:?Set the Maven settings.xml path}
